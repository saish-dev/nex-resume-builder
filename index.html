<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nex Resume</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Build your résumé section by section, customise every detail of the design, and download it as a PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=EB+Garamond:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Karla:wght@400;600;700&family=Lora:wght@400;600;700&family=Manrope:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Work+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style id="page-style"></style>
</head>
<body>
<div class="app" id="app" data-panel="content" data-mobile-preview="false">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">N</span>
      <span class="brand-name">Nex Resume</span>
    </div>
    <span class="status" id="status" role="status"></span>
    <div class="actions">
      <div class="more">
        <button type="button" class="btn more-toggle" id="more-btn" aria-expanded="false" aria-controls="more-menu" aria-label="More actions"></button>
        <div class="more-menu" id="more-menu">
          <button type="button" class="btn" id="import-btn">Import</button>
          <button type="button" class="btn" id="export-btn">Export</button>
        </div>
      </div>
      <button type="button" class="btn primary" id="pdf-btn"><span class="pdf-long">Download </span>PDF</button>
    </div>
  </header>
  <div class="toast" id="toast" aria-hidden="true"></div>
  <p class="embed-note" id="embed-note" hidden>Download PDF and Export work when you open the site directly. In this preview you can edit, customise and import.</p>

  <div class="workspace">
    <nav class="rail" id="rail" aria-label="Editor"></nav>

    <div class="side-panel" id="side-panel">
      <div class="panel" id="panel-content" aria-label="Content"></div>
      <div class="panel" id="panel-customize" aria-label="Customize" hidden></div>
    </div>

    <section class="preview-pane" aria-label="Live preview">
      <div class="preview-bar">
        <span class="chip" id="page-count">1 page</span>
        <span class="meta" id="paper-label">US Letter</span>
        <span class="meta hint-text" id="page-hint"></span>
        <div class="zoom" aria-label="Zoom">
          <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
          <button type="button" id="zoom-fit" class="zoom-label" aria-label="Fit to width">100%</button>
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <div class="sheet-frame" id="sheet-frame">
          <div class="sheet-scale" id="sheet-scale">
            <article class="resume" id="resume"></article>
            <div id="breaks" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <dialog class="add-dialog" id="add-dialog" aria-labelledby="add-title">
    <div class="dialog-head">
      <h2 id="add-title">Add content</h2>
      <button type="button" class="icon-btn" id="add-close" aria-label="Close">×</button>
    </div>
    <div class="type-grid" id="type-grid"></div>
  </dialog>

  <input type="file" id="photo-file" accept="image/*" hidden>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</div>
<script src="app.js"></script>
</body>
</html>
